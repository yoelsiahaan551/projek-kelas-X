<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar | Tokaz.store</title>
  <link rel="icon" type="image/png" href="../image/gambar3.png" />
  <link rel="stylesheet" href="../dist/output.css" />
  <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
</head>
<body class="h-screen bg-cover bg-center flex items-center justify-center" style="background-image: url('../image/gambar1.png');">
  <div class="w-full max-w-lg p-8 bg-white bg-opacity-90 rounded-xl shadow-md backdrop-blur-sm">
    <div class="flex items-center mb-6 space-x-3">
      <img src="../image/gambar3.png" alt="Logo" class="h-12">
      <span class="text-2xl font-bold text-blue-700">Tokaz.store</span>
    </div>

    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Buat Akun Baru</h2>

    <form id="registerForm" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" required placeholder="Masukkan email"
          class="w-full mt-1 p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
        <input type="text" id="username" name="username" required placeholder="Masukkan username"
          class="w-full mt-1 p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Kata Sandi</label>
        <input type="password" id="password" name="password" required placeholder="Masukkan kata sandi"
          class="w-full mt-1 p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Konfirmasi Kata Sandi</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Ulangi kata sandi"
          class="w-full mt-1 p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button type="submit"
        class="w-full py-3 bg-blue-700 text-white font-semibold rounded-md hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 transition">Daftar</button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
      Sudah punya akun? <a href="Masuk.html" class="text-blue-600 hover:text-blue-800 font-medium">Masuk sekarang</a>
    </p>
  </div>

  <script>
  const form = document.getElementById('registerForm');

  form.addEventListener('submit', async function(event) {
    event.preventDefault();

    const email = form.email.value.trim();
    const username = form.username.value.trim();
    const password = form.password.value;
    const confirmPassword = form.confirmPassword.value;

    if (password !== confirmPassword) {
      alert('Kata sandi dan konfirmasi kata sandi tidak sama!');
      return;
    }

    const userData = { email, username, password };

    localStorage.setItem('userData', JSON.stringify(userData));
    localStorage.setItem('loggedInUser', JSON.stringify(userData));

    await new Promise(resolve => setTimeout(resolve, 2000));

    window.location.href = '../homePage/beranda.html';
  });
</script>


  <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
</body>
</html>
